# respect historical role name with dash
role_name_check: 1
driver:
  name: vagrant
  provider:
    # libvirt (KVM/QEMU) is the default provider. Any other vagrant-supported
    # provider (virtualbox, parallels, vmware_desktop, ...) can be used here.
    name: libvirt
  # Run vagrant up with --provision.
  # Defaults to --no-provision)
  provision: false
  # vagrant-cachier configuration
  # Defaults to 'machine'
  # Any value different from 'machine' or 'box' will disable it
  cachier: machine
  # If set to false, set VAGRANT_NO_PARALLEL to '1'
  # Defaults to true - but that can cause issues with multiple machines
  parallel: false
  default_box: 'cloud-image/ubuntu-24.04'
platforms:
  - name: ubuntu2404
    box: cloud-image/ubuntu-24.04
    memory: 2048
    cpus: 2
    interfaces:
      - network_name: private_network
        type: dhcp
        auto_config: true
  - name: ubuntu2204
    box: cloud-image/ubuntu-22.04
    memory: 2048
    cpus: 2
    interfaces:
      - network_name: private_network
        type: dhcp
        auto_config: true
  - name: debian13
    box: debian/trixie64
    memory: 2048
    cpus: 2
    interfaces:
      - network_name: private_network
        type: dhcp
        auto_config: true
  - name: debian12
    box: debian/bookworm64
    memory: 2048
    cpus: 2
    interfaces:
      - network_name: private_network
        type: dhcp
        auto_config: true
  - name: rocky9
    box: generic/rocky9
    memory: 2048
    cpus: 2
    interfaces:
      - network_name: private_network
        type: dhcp
        auto_config: true


provisioner:
  name: ansible
  log: true
  scenario:
    name: default
  inventory:
    host_vars:
      ubuntu2404:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
      ubuntu2204:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
      debian13:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
      debian12:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
      rocky9:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
  config_options:
    defaults:
      allow_world_readable_tmpfiles: true
      callback_whitelist: profile_roles,profile_tasks,timer
      # https://github.com/ansible/ansible/issues/40208
      # https://github.com/ansible-community/molecule/issues/249
      # https://github.com/ansible-community/molecule/issues/2626
      ansible_python_interpreter: /usr/bin/python3
