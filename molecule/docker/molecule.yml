---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu2404
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: ubuntu2604
    image: "geerlingguy/docker-ubuntu2604-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  log: true
  inventory:
    host_vars:
      ubuntu2404:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
      ubuntu2604:
        role_under_test: ${MOLECULE_TEST_ROLE:-role_under_test}
verifier:
  name: ansible
scenario:
  name: docker
