---
# defaults file for sa-prometheus-exporters

role_dir: "{{ role_path }}"

option_install_go: false
go_version: 1.6

prometheus_exporters:
  - name: apache
  - name: nginx
  - name: blackbox
  - name: cadvisor
  - name: cloudwatch
  - name: ecs
  - name: elasticsearch
  - name: memcached
  - name: mongodb
  - name: monit
  - name: mysqld
  - name: proxysql
  - name: node
  - name: phpfpm
  - name: postgres
  - name: redis
  - name: sql
  - name: ssl

prometheus_user: prometheus
prometheus_group: prometheus

prometheus_base_dir: /opt/prometheus
prometheus_exporters_dir: "{{ prometheus_base_dir }}/exporters"
prometheus_data_dir: "{{ prometheus_base_dir }}/data"
prometheus_exporters_config_dir: /etc/prometheus/exporters

prometheus_apache_exporter_version: "1.1.3"
prometheus_nginx_exporter_version: "1.5.3"
prometheus_node_exporter_version: "1.13.1"
prometheus_blackbox_exporter_version: "0.29.1"
prometheus_elasticsearch_exporter_version: "1.11.0"
prometheus_postgres_exporter_version: "0.21.1"
prometheus_cadvisor_exporter_version: "0.61.1"
prometheus_mongodb_exporter_version: "0.55.0"
prometheus_redis_exporter_version: "1.99.0"
prometheus_sql_exporter_version: "0.24.14"
prometheus_memcached_exporter_version: "0.18.0"
prometheus_mysqld_exporter_version: "0.21.0"
prometheus_proxysql_exporter_version: "1.1.2"
prometheus_phpfpm_exporter_version: "2.2.0"
prometheus_ecs_exporter_version: "0.6.0"
prometheus_monit_exporter_version: "0.0.2"
prometheus_cloudwatch_exporter_version: "0.68.0"
prometheus_ssl_exporter_version: "2.4.3"
