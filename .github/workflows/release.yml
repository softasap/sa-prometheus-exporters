---
# This workflow requires a GALAXY_API_KEY secret present in the GitHub
# repository or organization. Sync it from the pass backend with:
#   make galaxy-secret
# See: https://github.com/marketplace/actions/publish-ansible-role-to-galaxy
# See: https://github.com/ansible/galaxy/issues/46

name: Release
'on':
  push:
    tags:
      - '*'

defaults:
  run:
    working-directory: 'role_under_test'

jobs:

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7
        with:
          path: 'role_under_test'

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Ansible.
        run: pip3 install ansible-core

      - name: Trigger a new import on Galaxy.
        run: >
          ansible-galaxy role import
          --api-key ${{ secrets.GALAXY_API_KEY }}
          $(echo ${{ github.repository }} | cut -d/ -f1)
          $(echo ${{ github.repository }} | cut -d/ -f2)

      - name: Refresh legacy dashed role name if present.
        run: |
          ROLE_NAME=$(grep -E '^\s*role_name:' meta/main.yml | awk '{print $2}')
          LEGACY_NAME=$(echo "$ROLE_NAME" | tr '_' '-')
          NAMESPACE=$(echo "${{ github.repository }}" | cut -d/ -f1)
          if [ "$LEGACY_NAME" = "$ROLE_NAME" ]; then
            echo "role name has no dashed variant ($ROLE_NAME); skipping legacy refresh."
            exit 0
          fi
          COUNT=$(python3 -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://galaxy.ansible.com/api/v1/roles/?owner__username=${NAMESPACE}&name=${LEGACY_NAME}')).get('count', 0))")
          if [ "$COUNT" -gt 0 ]; then
            echo "legacy role ${NAMESPACE}.${LEGACY_NAME} exists; refreshing."
            ansible-galaxy role import --role-name "$LEGACY_NAME" \
              --api-key ${{ secrets.GALAXY_API_KEY }} \
              "$NAMESPACE" "$(echo ${{ github.repository }} | cut -d/ -f2)"
          else
            echo "legacy role ${NAMESPACE}.${LEGACY_NAME} not found; skipping."
          fi
